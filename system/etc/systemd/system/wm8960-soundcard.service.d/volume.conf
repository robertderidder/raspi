# The Waveshare script re-links /var/lib/alsa/asound.state to its own default
# state file and restores from it on every boot, discarding whatever
# alsa-restore.service stored at shutdown. Set the volume after it instead.
# -M uses the same mapped scale as alsamixer, so 80% here is 80% there.
[Service]
ExecStartPost=/usr/bin/amixer -q -M -c wm8960soundcard sset Headphone 80%
